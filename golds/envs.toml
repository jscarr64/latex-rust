# Milestone 7 — multiline environments, numbering, array, substack.

[[gold]]
name = "aligned-two-ast"
kind = "ast"
input = "\\begin{aligned} f(x) &= x^2 + 2x + 1 \\\\ &= (x+1)^2 \\end{aligned}"
expect = "(matrix aligned ((row (atom Ord \"f\") (atom Open \"(\") (atom Ord \"x\") (atom Close \")\")) (row (atom Rel \"=\") (sup (atom Ord \"x\") (atom Ord \"2\")) (atom Bin \"+\") (atom Ord \"2\") (atom Ord \"x\") (atom Bin \"+\") (atom Ord \"1\"))) ((row) (row (atom Rel \"=\") (sup (row (atom Open \"(\") (atom Ord \"x\") (atom Bin \"+\") (atom Ord \"1\") (atom Close \")\")) (atom Ord \"2\")))))"

[[gold]]
name = "aligned-two-dims"
kind = "dims"
style = "display"
input = "\\begin{aligned} f(x) &= x^2 + 2x + 1 \\\\ &= (x+1)^2 \\end{aligned}"
expect = "w=8.019244444444444444444444 h=1.608 d=1.092"

